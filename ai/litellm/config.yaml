# LiteLLM proxy — the translation layer between the harness and a local model.
#
# WHY THIS EXISTS. gameLoop.js calls openai.responses.create() at four sites:
# the RESPONSES API, with `input:` rather than `messages:`, plus reasoning
# effort and summary, service_tier, store:true and stream:true consumed as
# typed events. LM Studio, llama.cpp and Ollama implement /v1/chat/completions
# and NOT /v1/responses, so the harness 404s on its first call no matter what
# OPENAI_BASE_URL points at.
#
# THE ONE SETTING THAT MATTERS IS use_chat_completions_api. With a custom
# api_base LiteLLM's DEFAULT is to forward /v1/responses through unchanged --
# straight into the 404 this whole file exists to avoid. The bridge is opt-in
# per model and silence here looks exactly like success until the first call.

model_list:
  # The decision model. IT MUST TAKE IMAGES.
  #
  # The harness attaches a screenshot to every decision alongside the RAM
  # state -- "no vision anywhere, it reads RAM" was wrong, and the symptom was
  # a 400 from the model server itself: "The provided input contains images,
  # but ternary-bonsai-8b-mlx does not support image inputs."
  #
  # qwen3-vl-8b, after minicpm-v-4.6 was tried first and could not hold the
  # tool-call schema: the harness logged "Executing Action 1/2: undefined" --
  # calls arriving with no readable action name -- then empty calls, then a
  # malformed request built from them. minicpm answers a single vision question
  # in 3 seconds and is excellent at that; a long agentic loop that must emit
  # well-formed tool calls every turn is a different demand.
  #
  # Slower and correct beats fast and unusable. minicpm keeps the fallback seat
  # and the whole of daemons-vision, where one careful description is the job.
  #
  # MEASURED THREE WAYS, and only the third one meant anything.
  #
  #                     1 tool    plain vision   the HARNESS's union
  #   qwen3-vl-8b        6.1s        6.6s          9.3s   correct
  #   qwen3-vl-4b        4.7s        5.2s         11.6s   correct, SLOWER
  #   minicpm-v-4.6      1.9s        2.5s         300s+   TIMED OUT
  #
  # The first two columns say minicpm is two to three times faster and every
  # model emits valid tool_calls. Both are true and neither predicts anything:
  # execute_action takes an array of a UNION of eight variants, each keyed by a
  # literal "type", and on that schema minicpm does not answer at all. The
  # harness's "Executing Action 1/2: undefined" was degenerate output from a
  # model lost in the union, not a parser problem and not a speed problem.
  #
  # 4b is slower than 8b on the real schema -- the smaller model reasons longer
  # on the hard shape -- so "drop a size for speed" is not available here. The
  # bottleneck is schema complexity, not parameter count.
  #
  # EVERY VISION MODEL ON THE MACHINE, ON THE UNION:
  #     qwen3-vl-8b      9.3s   correct     <- this seat
  #     gemma-3-4b      10.0s   correct     but one action where two were asked
  #     qwen3-vl-4b     11.6s   correct
  #     minicpm-v-4.6   300s+   no answer
  #
  # THOSE THREE NUMBERS ARE COLD STARTS AND SHOULD NOT BE COMPARED. LM Studio
  # reported the models as not-loaded, so each first call paid a model load.
  # Warmed, qwen3-vl-8b answers the same union in ~3.7s. The ranking survives
  # -- minicpm still never answers -- but "the floor is the schema" did not:
  # trimming the union to five variants changed nothing (3.7s vs 3.8s).
  #
  # So the real cost per decision is prompt size, not variant count, and the
  # lever that would matter is the ~114k tokens the harness sends.
  #
  # UNTESTED AND WORTH TESTING: stock MiniCPM-V 4.6. The one here is
  # "abliterated-and-disinhibited", and abliteration ablates the refusal
  # direction at the cost of instruction-following -- the exact capability an
  # eight-way union needs. It is a plausible reason this model alone stalls,
  # and the test is one download.
  #
  # CONTEXT WINDOWS, which decide this as much as speed does:
  #     qwen3-vl-8b / 4b / minicpm-v-4.6   262144
  #     gemma-3-4b                         131072
  # The harness summarises at OPENAI_TOKEN_LIMIT and defaults to 250000 --
  # under qwen's ceiling with nothing to spare, and DOUBLE what gemma can hold.
  # bindDaemons.sh sets 200000, which fits every model here with headroom for
  # the summary call itself. Raise it only for a model that can take it.
  #
  # RULED OUT: MiniCPM5-1B and -2B. Text only, no native multimodal input, and
  # every decision here carries a screenshot.
  #
  # Point api_base at whatever is actually serving: LM Studio's default is
  # 1234, llama.cpp's server is usually 8080.
  - model_name: daemons
    litellm_params:
      model: openai/qwen/qwen3-vl-8b       # openai/ = OpenAI-compatible, not OpenAI
      # 127.0.0.1, NOT roverbyteseer.local. LM Studio binds to loopback only
      # -- `LM Studio 127.0.0.1:1234 (LISTEN)` -- so the LAN name resolves to an
      # address nothing is listening on. LiteLLM runs on this same box, so
      # loopback is right; it is the PROXY that gets exposed, never LM Studio.
      api_base: http://127.0.0.1:1234/v1
      api_key: none                        # local servers do not check it
      use_chat_completions_api: true       # THE BRIDGE. Not optional here.

  # Same server, named separately so the harness's pathfinding model can be
  # pointed somewhere smaller and faster without touching the decision model.
  - model_name: daemons-pathfinding
    litellm_params:
      # Smaller and faster on purpose: navigation is the call that happens
      # hundreds of times a run and needs the least thinking. Still a VLM,
      # because the harness attaches a screenshot to these calls too.
      model: openai/qwen/qwen3-vl-4b
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true

  # The fallback seat. NOT minicpm: a fallback that times out is worse than no
  # fallback, because the run stalls for five minutes before failing anyway.
  - model_name: daemons-qwen
    litellm_params:
      model: openai/qwen/qwen3-vl-4b
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true

  # Vision lives in LM Studio with the text models, not on 8890. The n8n
  # container sets MLX_VLM_URL=http://host.docker.internal:1234, so the 8890 in
  # the workflows is a fallback that never fires -- checked with
  # `docker exec n8n env`, which is the source of truth over any default.
  # qwen/qwen3-vl-8b is loaded too if MiniCPM disappoints on menu text.
  - model_name: daemons-vision
    litellm_params:
      model: openai/minicpm-v-4.6-abliterated-and-disinhibited
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true

  # MiniCPM through mlx-vlm, NOT LM Studio.
  #
  # LM Studio cannot parse this model's tool calls:
  #     Failed to parse tool call: Expected "<parameter=", but got "<keys=['A',"
  # MiniCPM emits its own XML dialect. The same weights served by mlx-vlm return
  # a clean nested tool call in 5.7s, first try, with the right key for the
  # situation. The model was never the problem; the parser was.
  #
  # vLLM was the obvious fix and is not available here: vllm-metal is an MLX
  # server wearing the name, with no tool-parser options at all, and real
  # vLLM's --tool-call-parser minicpm5 needs CUDA.
  #
  # Streaming works. An earlier note here said it did not -- that was a bug in
  # my test, which counted only tool_calls deltas; LiteLLM emits no
  # function_call_arguments.delta for this backend, only .done, and puts the
  # finished call in response.completed, which is exactly where the harness
  # reads it (gameLoop.js finalResponse.output). Measured through the proxy
  # with the REAL schema, both tool shapes, enum and enum-stripped: 20/20 tool
  # calls, call_id present.
  #
  # What is NOT settled is which key it picks. On a bare one-line prompt with
  # no screenshot it reached for face_up, up, and a "right" action type that
  # does not exist -- but that is not the harness's actual input, so it is a
  # hint, not a verdict. The real test is a run.
  #
  # Start the server before using this model:
  #   ~/.vllm-venv/bin/python -m mlx_vlm.server \
  #     --model ~/.lmstudio/models/mlx-community/MiniCPM-V-4.6-4bit --port 8101
  - model_name: minicpm-mlxvlm
    litellm_params:
      model: openai//Users/roverbyte/.lmstudio/models/mlx-community/MiniCPM-V-4.6-4bit
      api_base: http://127.0.0.1:8101/v1
      api_key: none
      use_chat_completions_api: true

# ---- generated by tools/ai_models.py ----
  - model_name: minicpm-v-4-6
    litellm_params:
      model: openai/minicpm-v-4.6
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true
  - model_name: minicpm-v-4-6-abliterated-and-disinhibited
    litellm_params:
      model: openai/minicpm-v-4.6-abliterated-and-disinhibited
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true
  - model_name: qwen3-vl-8b
    litellm_params:
      model: openai/qwen/qwen3-vl-8b
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true
  - model_name: qwen3-vl-4b
    litellm_params:
      model: openai/qwen/qwen3-vl-4b
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true
  - model_name: gemma-3-4b
    litellm_params:
      model: openai/google/gemma-3-4b
      api_base: http://127.0.0.1:1234/v1
      api_key: none
      use_chat_completions_api: true
# ---- end generated ----

litellm_settings:
  # Retry a failed daemons call against the bigger VLM instead of stopping.
  fallbacks: [{"daemons": ["daemons-qwen"]}]
  # The harness sends service_tier, store and reasoning.summary. OpenAI accepts
  # them; a local server 400s. Dropping beats patching four call sites and then
  # re-patching them on every upstream change.
  drop_params: true
  request_timeout: 600

general_settings:
  # This is the auth. Set LITELLM_MASTER_KEY in the environment and give the
  # same value to the harness as OPENAI_API_KEY -- which means if this ever is
  # exposed through the iMac, it is already authenticated and needs nothing new.
  master_key: os.environ/LITELLM_MASTER_KEY

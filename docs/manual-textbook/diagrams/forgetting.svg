<text x="16" y="18" font-size="11" fill="#5b5d66" text-anchor="start" font-weight="600">savings in relearning</text>
<text x="280" y="268" font-size="11" fill="#5b5d66" text-anchor="middle" font-weight="400">time since learning (drawn on a stretching scale)</text>

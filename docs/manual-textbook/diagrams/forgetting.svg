<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 276" font-family="Gill Sans, Gill Sans MT, Avenir Next, Helvetica Neue, sans-serif">
  <!-- PRINCIPLES OF MIND: Ebbinghaus's savings after delays, from his 1885 tables -->
<path d="M60 24 V230 H500" stroke="#1b1c20" stroke-width="1.2" fill="none"/>
<path d="M60 230 H500" stroke="#cfccc2" stroke-width=".8"/>
<text x="52" y="234" font-size="10.5" fill="#5b5d66" text-anchor="end" font-weight="400">0%</text>
<path d="M60 172.857 H500" stroke="#cfccc2" stroke-width=".8"/>
<text x="52" y="176.857" font-size="10.5" fill="#5b5d66" text-anchor="end" font-weight="400">20%</text>
<path d="M60 115.714 H500" stroke="#cfccc2" stroke-width=".8"/>
<text x="52" y="119.714" font-size="10.5" fill="#5b5d66" text-anchor="end" font-weight="400">40%</text>
<path d="M60 58.5714 H500" stroke="#cfccc2" stroke-width=".8"/>
<text x="52" y="62.5714" font-size="10.5" fill="#5b5d66" text-anchor="end" font-weight="400">60%</text>
<path d="M75.3 63.7 L133.5 103.7 L248.9 127.7 L302.1 133.7 L338.9 150.6 L397.2 157.4 L484.3 169.7" stroke="#9a7b1c" stroke-width="2.6" fill="none" stroke-linejoin="round"/>

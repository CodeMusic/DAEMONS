<text x="397.192" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">6 days</text>
<circle cx="484.3" cy="169.7" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>

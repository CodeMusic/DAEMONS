<text x="75.2616" y="53.7143" font-size="10.5" fill="#1b1c20" text-anchor="middle" font-weight="600">58.2</text>
<text x="75.2616" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">20 min</text>
<circle cx="133.5" cy="103.7" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>
<text x="133.543" y="93.7143" font-size="10.5" fill="#1b1c20" text-anchor="middle" font-weight="600">44.2</text>
<text x="133.543" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">1 hour</text>
<circle cx="248.9" cy="127.7" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>
<text x="248.914" y="117.714" font-size="10.5" fill="#1b1c20" text-anchor="middle" font-weight="600">35.8</text>
<text x="248.914" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">9 hours</text>
<circle cx="302.1" cy="133.7" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>
<text x="302.139" y="123.714" font-size="10.5" fill="#1b1c20" text-anchor="middle" font-weight="600">33.7</text>
<text x="302.139" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">1 day</text>
<circle cx="338.9" cy="150.6" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>
<text x="338.911" y="140.571" font-size="10.5" fill="#1b1c20" text-anchor="middle" font-weight="600">27.8</text>
<text x="338.911" y="248" font-size="10.5" fill="#5b5d66" text-anchor="middle" font-weight="400">2 days</text>
<circle cx="397.2" cy="157.4" r="4.2" fill="#9a7b1c" stroke="#fff" stroke-width="1.2"/>

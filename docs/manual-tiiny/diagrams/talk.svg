<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="9">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker>
        <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8524f"/></marker></defs>
  <rect x="6" y="40" width="80" height="44" rx="6" fill="#fff" stroke="#16161a"/><text x="46" y="58" text-anchor="middle" font-weight="700">YOU</text><text x="46" y="72" text-anchor="middle" fill="#5a5a64">"how did you sleep?"</text>
  <path d="M86 62L126 62" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <rect x="128" y="22" width="150" height="82" rx="8" fill="#16161a"/>
  <text x="203" y="40" text-anchor="middle" fill="#fff" font-weight="700">THE HUB</text>
  <text x="140" y="56" fill="#d9d4c4">1  writes the daemon's SELF:</text>
  <text x="150" y="68" fill="#d9d4c4" font-size="8">name, INDEX entry, bond, meals,</text>
  <text x="150" y="79" fill="#d9d4c4" font-size="8">sleep, dream, feelings, the day</text>
  <text x="140" y="95" fill="#d9d4c4">2  sends it with your words</text>
  <path d="M278 62L330 62" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <rect x="332" y="30" width="100" height="64" rx="10" fill="#e6f0ea" stroke="#3f7a52" stroke-width="1.6"/>
  <text x="382" y="52" text-anchor="middle" font-weight="700" fill="#2e5a3c">THE TIINY</text><text x="382" y="66" text-anchor="middle">thinks as it,</text><text x="382" y="78" text-anchor="middle">may speak it</text>
  <path d="M432 62L470 62" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <rect x="472" y="40" width="42" height="44" rx="6" fill="#fff" stroke="#16161a"/><text x="493" y="58" text-anchor="middle" font-weight="700">PING</text><text x="493" y="72" text-anchor="middle" fill="#5a5a64">answers</text>
  <!-- fallback -->
  <path d="M203 104L203 140" stroke="#b8524f" stroke-dasharray="4 3" fill="none" marker-end="url(#ag)"/>
  <text x="212" y="126" fill="#b8524f">the Tiiny away or silent?</text>
  <rect x="128" y="142" width="110" height="40" rx="6" fill="#fff" stroke="#16161a"/><text x="183" y="158" text-anchor="middle" font-weight="700">the hub's AI board</text><text x="183" y="171" text-anchor="middle" fill="#5a5a64">a short self</text>
  <path d="M238 162L274 162" stroke="#b8524f" stroke-dasharray="4 3" fill="none" marker-end="url(#ag)"/>
  <rect x="276" y="142" width="110" height="40" rx="6" fill="#fff" stroke="#16161a"/><text x="331" y="158" text-anchor="middle" font-weight="700">n8n on roverbyteseer</text><text x="331" y="171" text-anchor="middle" fill="#5a5a64">your own model</text>
  <text x="260" y="202" text-anchor="middle" fill="#5a5a64">a daemon is never left without words: each one down the line answers when the one above cannot</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="9.5">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker></defs>
  <rect x="6" y="14" width="508" height="236" rx="10" fill="#f1ecf8" stroke="#8a5cc8" stroke-width="1.4"/>
  <text x="18" y="34" font-weight="700" font-size="10" letter-spacing="2" fill="#6b3fa0">YOUR HOME</text>
  <!-- devices -->
  <rect x="20" y="52" width="76" height="32" rx="6" fill="#fff" stroke="#16161a"/><text x="58" y="72" text-anchor="middle">your phone</text>
  <rect x="20" y="94" width="76" height="32" rx="6" fill="#fff" stroke="#16161a"/><text x="58" y="108" text-anchor="middle">a watch,</text><text x="58" y="120" text-anchor="middle">a handheld</text>
  <rect x="20" y="136" width="76" height="32" rx="6" fill="#fff" stroke="#16161a"/><text x="58" y="150" text-anchor="middle">the site,</text><text x="58" y="162" text-anchor="middle">on any screen</text>
  <path d="M96 68L120 96" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <path d="M96 110L120 110" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <path d="M96 152L120 124" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <!-- hub -->
  <rect x="122" y="78" width="88" height="68" rx="8" fill="#16161a"/><text x="166" y="100" text-anchor="middle" fill="#fff" font-weight="700">THE HUB</text>
  <text x="166" y="115" text-anchor="middle" fill="#d9d4c4" font-size="8.5">holds the key,</text><text x="166" y="126" text-anchor="middle" fill="#d9d4c4" font-size="8.5">writes the self,</text><text x="166" y="137" text-anchor="middle" fill="#d9d4c4" font-size="8.5">asks the Tiiny</text>
  <rect x="122" y="168" width="88" height="34" rx="6" fill="#fff" stroke="#16161a" stroke-dasharray="4 3"/><text x="166" y="182" text-anchor="middle" font-size="8.5">its AI board:</text><text x="166" y="194" text-anchor="middle" font-size="8.5">the small, fast one</text>
  <path d="M166 146L166 166" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <!-- roverbyteseer -->
  <rect x="246" y="58" width="122" height="108" rx="8" fill="#fbfaf6" stroke="#16161a"/>
  <text x="307" y="76" text-anchor="middle" font-weight="700">ROVERBYTESEER</text>
  <text x="307" y="90" text-anchor="middle" font-size="8.5" fill="#5a5a64">the house computer</text>
  <text x="258" y="108" font-size="8.5">LiteLLM :4000</text><text x="258" y="121" font-size="8.5">n8n</text><text x="258" y="134" font-size="8.5">Chatterbox (voices)</text><text x="258" y="147" font-size="8.5">TiinyOS, to set it up</text>
  <path d="M210 104L244 104" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <text x="227" y="98" text-anchor="middle" font-size="8" fill="#5a5a64">/v1</text>
  <!-- tiiny -->
  <rect x="404" y="58" width="96" height="108" rx="10" fill="#e6f0ea" stroke="#3f7a52" stroke-width="1.6"/>
  <text x="452" y="78" text-anchor="middle" font-weight="700" fill="#2e5a3c">TIINY POCKET</text>
  <text x="452" y="96" text-anchor="middle" font-size="8.5">80 GB, two NPUs</text>
  <text x="452" y="110" text-anchor="middle" font-size="8.5">a 35B thinker</text>
  <text x="452" y="122" text-anchor="middle" font-size="8.5">hearing, voices,</text>
  <text x="452" y="134" text-anchor="middle" font-size="8.5">pictures</text>
  <text x="452" y="152" text-anchor="middle" font-size="8" fill="#5a5a64">its own 65 W brick</text>
  <path d="M368 96L402 96" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <text x="385" y="90" text-anchor="middle" font-size="8" fill="#5a5a64">network</text>
  <path d="M402 128L370 128" stroke="#3f7a52" stroke-dasharray="3 2" fill="none" marker-end="url(#ar)"/>
  <text x="386" y="140" text-anchor="middle" font-size="8" fill="#3f7a52">USB-C</text>
  <!-- straight path -->
  <path d="M210 82C260 30 400 26 450 56" stroke="#3f7a52" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
  <text x="330" y="38" text-anchor="middle" font-size="8" fill="#3f7a52">or straight to its own /openai/v1</text>
  <text x="260" y="232" text-anchor="middle" font-size="8.5" fill="#5a5a64">phones and boards only ever talk to the hub; the hub is the only thing that calls the Tiiny</text>
</svg>

  <path d="M40 120 C 90 60, 130 60, 160 110 S 240 160, 270 100 S 350 50, 380 110 S 460 150, 490 90" stroke="#fbfaf6" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <g font-weight="700" text-anchor="middle">
    <circle cx="40" cy="120" r="15" fill="#16161a"/><text x="40" y="124" fill="#fff">1</text>
    <circle cx="160" cy="110" r="15" fill="#16161a"/><text x="160" y="114" fill="#fff">2</text>
    <circle cx="270" cy="100" r="15" fill="#16161a"/><text x="270" y="104" fill="#fff">3</text>

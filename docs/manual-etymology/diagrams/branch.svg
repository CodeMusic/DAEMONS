<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- THE OLD WORD: the old word's road, top to bottom -- the trunk is the word this game is named for; the grey branch
       is where the similarly spelt, frightening word forked away, and it is never named here -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8892" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8a8892" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- the trunk -->
  <path d="M96 36 L96 566" stroke="#c9a24a" stroke-width="7" stroke-linecap="round"/>
  <!-- the fork: a grey branch curling away into nothing -->
  <path d="M96 318 C150 322 220 330 280 342 C330 352 380 356 430 358" stroke="url(#fade)" stroke-width="5" fill="none"
        stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="150" y="376" fill="#8a8892" font-size="11.5" font-style="italic">a similarly spelt, frightening word</text>
  <text x="150" y="391" fill="#8a8892" font-size="11.5" font-style="italic">forks away here</text>
  <!-- the stops along the trunk: when, at left; what, at right -->
  <g font-size="11" fill="#5a5a64" text-anchor="end">
    <text x="80" y="48">about 700 BCE</text>
    <text x="80" y="108">about 400 BCE</text>
    <text x="80" y="168">about 330 BCE</text>
    <text x="80" y="228">2nd century</text>
    <text x="80" y="294">3rd century BCE</text>
    <text x="80" y="308">to 5th CE</text>
    <text x="80" y="432">1560s</text>
    <text x="80" y="482">1867</text>
    <text x="80" y="532">1963</text>
    <text x="80" y="582">today</text>
  </g>
  <g fill="#fbfaf6" stroke="#16161a" stroke-width="2">
    <circle cx="96" cy="44" r="8"/><circle cx="96" cy="104" r="8"/><circle cx="96" cy="164" r="8"/>
    <circle cx="96" cy="224" r="8"/><circle cx="96" cy="428" r="8"/><circle cx="96" cy="478" r="8"/>
    <circle cx="96" cy="528" r="8"/>
  </g>
  <circle cx="96" cy="290" r="9" fill="#8a8892" stroke="#16161a" stroke-width="2"/>
  <circle cx="96" cy="578" r="10" fill="#c9a24a" stroke="#16161a" stroke-width="2"/>
  <g fill="#16161a">
    <text x="118" y="44" font-size="15" font-weight="700">δαίμων, daimōn</text>
    <text x="118" y="61" font-size="11.5" fill="#5a5a64">Greek: a spirit who hands each their share; a guardian</text>
    <text x="118" y="104" font-size="15" font-weight="700">Socrates' daimonion</text>
    <text x="118" y="121" font-size="11.5" fill="#5a5a64">the inner voice that only ever said "not that"</text>
    <text x="118" y="164" font-size="15" font-weight="700">eudaimonia</text>
    <text x="118" y="181" font-size="11.5" fill="#5a5a64">a good daimon: a happy, flourishing life</text>
    <text x="118" y="224" font-size="15" font-weight="700">daemon, and the genius</text>
    <text x="118" y="241" font-size="11.5" fill="#5a5a64">Latin: the go-between, and a guardian of one's own</text>
    <text x="118" y="288" font-size="15" font-weight="700">the fork</text>
    <text x="118" y="305" font-size="11.5" fill="#5a5a64">a new meaning, and in time a spelling of its own</text>
    <text x="118" y="428" font-size="15" font-weight="700">daemon, kept</text>
    <text x="118" y="445" font-size="11.5" fill="#5a5a64">English: the old spelling, for the Greeks' meaning</text>
    <text x="118" y="478" font-size="15" font-weight="700">Maxwell's daemon</text>
    <text x="118" y="495" font-size="11.5" fill="#5a5a64">a being who sorts the fast from the slow</text>
    <text x="118" y="528" font-size="15" font-weight="700">a computer's daemons</text>
    <text x="118" y="545" font-size="11.5" fill="#5a5a64">helpers that run by themselves, in the background</text>
    <text x="118" y="578" font-size="15" font-weight="800">DAEMONS, said DAY-mons</text>
    <text x="118" y="595" font-size="11.5" fill="#5a5a64">this game: both meanings at once</text>
  </g>
</svg>

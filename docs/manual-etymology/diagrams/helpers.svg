<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 214" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- THE OLD WORD: a computer's daemons, the helpers that run in the background, each named with a d at the end -->
  <rect x="6" y="6" width="468" height="202" rx="10" fill="#2b2b31" stroke="#16161a" stroke-width="2"/>
  <rect x="6" y="6" width="468" height="26" rx="10" fill="#4a4955"/>
  <rect x="6" y="22" width="468" height="10" fill="#4a4955"/>
  <circle cx="24" cy="19" r="5" fill="#e0675a"/><circle cx="40" cy="19" r="5" fill="#e8b64c"/><circle cx="56" cy="19" r="5" fill="#6cbf6a"/>
  <text x="240" y="23.5" fill="#e4e0ee" font-size="11.5" text-anchor="middle">what runs in the background</text>
  <g font-family="Menlo, SF Mono, Courier New, monospace" font-size="12.5">
    <text x="24" y="62" fill="#9fe0a8">sshd</text>
    <text x="104" y="62" fill="#e4e0ee">waits for a knock, and lets them in</text>
    <text x="24" y="90" fill="#9fe0a8">crond</text>
    <text x="104" y="90" fill="#e4e0ee">keeps the clock's appointments</text>
    <text x="24" y="118" fill="#9fe0a8">syslogd</text>
    <text x="104" y="118" fill="#e4e0ee">writes down what happened</text>
    <text x="24" y="146" fill="#9fe0a8">httpd</text>
    <text x="104" y="146" fill="#e4e0ee">hands out web pages</text>
  </g>
  <text x="24" y="176" fill="#b9b5c8" font-size="11.5" font-style="italic">The d at the end of each name is for daemon.</text>
  <text x="24" y="193" fill="#b9b5c8" font-size="11.5" font-style="italic">Each one runs by itself, without being asked.</text>
</svg>

  <g font-weight="700" font-size="9" letter-spacing="1.2" fill="#9a4a38">
    <text x="334" y="82">THE CROWN</text>
    <text x="6" y="30">TOUCH, ANYWHERE</text>
    <text x="6" y="88">ON THE FACE</text>
    <text x="6" y="158">THE STRIP (ULTRA)</text>
    <text x="334" y="178">THE WRIST (ULTRA)</text>
  </g>
  <g fill="#16161a">
    <text x="334" y="96">press: back a step</text>
    <text x="334" y="109">press twice: home, to the face</text>
    <text x="334" y="122">hold: the watch sleeps</text>
    <text x="334" y="135">hold longer: it switches off</text>
    <text x="334" y="148">asleep: a press wakes it</text>
    <text x="6" y="44">tap: press what is under</text>
    <text x="6" y="56">swipe: turn, or move a list</text>
    <text x="6" y="68">hold: back</text>
    <text x="6" y="102">hold the daemon: TALK</text>
    <text x="6" y="114">tap twice: CARE</text>
    <text x="6" y="126">swipe: the pages</text>
    <text x="6" y="172">tap one of three</text>
    <text x="6" y="184">buttons you choose</text>
    <text x="334" y="192">raise it: the screen wakes</text>
    <text x="334" y="205">shake it: wake, or it hops</text>
    <text x="334" y="218">tap it twice: CARE</text>
  </g>

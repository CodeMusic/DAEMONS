  <g fill="#3d4260"><rect x="186" y="156" width="27" height="20" rx="4"/><rect x="217" y="156" width="27" height="20" rx="4"/><rect x="248" y="156" width="27" height="20" rx="4"/></g>
  <g fill="#f4efe6" font-size="5.5" font-weight="700" text-anchor="middle"><text x="199.5" y="168">CARE</text><text x="230.5" y="168">MUSIC</text><text x="261.5" y="168">HOURS</text></g>
  <g stroke="#16161a" fill="none" stroke-width="0.8">
    <path d="M330 117 L304 117" marker-end="url(#ar)"/>
    <path d="M150 98 L226 118" marker-end="url(#ar)"/>
    <path d="M150 168 L184 166" marker-end="url(#ar)"/>
    <path d="M150 40 L200 60" marker-end="url(#ar)"/>

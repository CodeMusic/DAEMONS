<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="8">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d6a9a"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3f7a52"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b5aa6"/></marker></defs>
<text x="6" y="12" font-weight="700" font-size="8" fill="#5a5a64" letter-spacing="1">EMBODY: FROM A BODY NOBODY KNOWS TO A DAEMON STRETCHING IN IT</text>
<rect x="26" y="20" width="120" height="30" rx="6" fill="#fff" stroke="#16161a"/>
<text x="86" y="33" text-anchor="middle" font-weight="700" font-size="9" fill="#16161a">THE PHONE</text>
<text x="86" y="44" text-anchor="middle" font-size="7.5" fill="#5a5a64">the companion app</text>
<path d="M86 50L86 398" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="200" y="20" width="120" height="30" rx="6" fill="#16161a" stroke="#16161a"/>
<text x="260" y="33" text-anchor="middle" font-weight="700" font-size="9" fill="#fff">THE BODY</text>
<text x="260" y="44" text-anchor="middle" font-size="7.5" fill="#d9d4c4">new, on your table</text>
<path d="M260 50L260 398" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="374" y="20" width="120" height="30" rx="6" fill="#fff" stroke="#16161a"/>
<text x="434" y="33" text-anchor="middle" font-weight="700" font-size="9" fill="#16161a">THE HUB</text>
<text x="434" y="44" text-anchor="middle" font-size="7.5" fill="#5a5a64">the house</text>
<path d="M434 50L434 398" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="12" cy="74" r="7" fill="#16161a"/><text x="12" y="77" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">1</text>
<path d="M257 76L89 76" stroke="#3d6a9a" stroke-width="1.4" fill="none" marker-end="url(#mb)"/><text x="173" y="72" text-anchor="middle" fill="#3d6a9a">a body is near: its kind and its name</text>
<circle cx="12" cy="100" r="7" fill="#16161a"/><text x="12" y="103" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">2</text>
<path d="M89 102L257 102" stroke="#3d6a9a" stroke-width="1.4" fill="none" marker-end="url(#mb)"/><text x="173" y="98" text-anchor="middle" fill="#3d6a9a">PAIR</text>
<rect x="172" y="108" width="176" height="26" rx="4" fill="#f0eee6"/><text x="260" y="119" text-anchor="middle" font-size="7.5">it says six numbers aloud;</text><text x="260" y="129" text-anchor="middle" font-size="7.5">you type them: now only your phone may ask</text>
<circle cx="12" cy="152" r="7" fill="#16161a"/><text x="12" y="155" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">3</text>
<path d="M257 154L89 154" stroke="#3d6a9a" stroke-width="1.4" fill="none" marker-end="url(#mb)"/><text x="173" y="150" text-anchor="middle" fill="#3d6a9a">its sheet, in short: what it is, what it has</text>
<circle cx="12" cy="178" r="7" fill="#16161a"/><text x="12" y="181" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">4</text>
<path d="M89 180L257 180" stroke="#3d6a9a" stroke-width="1.4" fill="none" marker-end="url(#mb)"/><text x="173" y="176" text-anchor="middle" fill="#3d6a9a">your Wi-Fi, the hub's address, a code</text>
<circle cx="12" cy="204" r="7" fill="#16161a"/><text x="12" y="207" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">5</text>
<path d="M263 206L431 206" stroke="#16161a" stroke-width="1.4" fill="none" marker-end="url(#mk)"/><text x="347" y="202" text-anchor="middle" fill="#16161a">joins with the code, keeps its own key</text>
<rect x="374" y="212" width="120" height="16" rx="4" fill="#f0eee6"/><text x="434" y="223" text-anchor="middle" font-size="7.5">it stands in YOUR DEVICES</text>
<circle cx="12" cy="248" r="7" fill="#16161a"/><text x="12" y="251" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">6</text>
<path d="M89 250L431 250" stroke="#6b5aa6" stroke-width="1.4" fill="none" marker-end="url(#mp)"/><text x="260" y="246" text-anchor="middle" fill="#6b5aa6"></text>
<text x="173" y="236" text-anchor="middle" fill="#6b5aa6">EMBODY: this daemon,</text><text x="173" y="246" text-anchor="middle" fill="#6b5aa6">in that body</text>
<circle cx="12" cy="278" r="7" fill="#16161a"/><text x="12" y="281" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">7</text>
<path d="M431 280L263 280" stroke="#6b5aa6" stroke-width="1.4" fill="none" marker-end="url(#mp)"/><text x="347" y="276" text-anchor="middle" fill="#6b5aa6">who it is: its SELF, its voice, its day</text>
<rect x="172" y="294" width="176" height="36" rx="4" fill="#e6f0ea"/><text x="260" y="305" text-anchor="middle" font-size="7.5">THE DAEMON ARRIVES</text><text x="260" y="315" text-anchor="middle" font-size="7.5">the body's own actions are waiting for it;</text><text x="260" y="325" text-anchor="middle" font-size="7.5">it stretches, and says its first words</text>
<circle cx="12" cy="354" r="7" fill="#16161a"/><text x="12" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">8</text>
<path d="M263 356L431 356" stroke="#16161a" stroke-width="1.4" fill="none" marker-end="url(#mk)" stroke-dasharray="4 3"/><text x="347" y="352" text-anchor="middle" fill="#16161a">what was said, done and felt, as it happens</text>
<circle cx="12" cy="382" r="7" fill="#16161a"/><text x="12" y="385" text-anchor="middle" fill="#fff" font-weight="700" font-size="8">9</text>
<path d="M89 384L431 384" stroke="#6b5aa6" stroke-width="1.4" fill="none" marker-end="url(#mp)"/><text x="260" y="380" text-anchor="middle" fill="#6b5aa6"></text>
<text x="173" y="370" text-anchor="middle" fill="#6b5aa6">COME OUT: the daemon</text><text x="173" y="380" text-anchor="middle" fill="#6b5aa6">goes home; the body rests</text>
<text x="6" y="414" font-size="8" fill="#5a5a64">Blue is Bluetooth, black is Wi-Fi. Steps 1 to 5 happen once for a body; 6 to 9 each time a daemon goes in or comes out.</text>
</svg>

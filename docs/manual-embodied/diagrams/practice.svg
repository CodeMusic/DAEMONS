<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 348" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="8">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a5a64"/></marker>
  </defs>
  <text x="6" y="12" font-weight="700" font-size="8" fill="#5a5a64" letter-spacing="1">THREE WAYS TO PROPOSE A MOVEMENT</text>
  <!-- three ways -->
  <rect x="6" y="20" width="164" height="76" rx="8" fill="#f0eef7" stroke="#6b5aa6" stroke-width="1.4"/>
  <text x="16" y="36" font-weight="700" font-size="10" fill="#4a3d7a">SHOWN</text><text x="160" y="36" text-anchor="end" fill="#5a5a64" font-size="7.5">supervised</text>
  <text x="16" y="50">A person sets poses on the phone,</text><text x="16" y="61">or picks from a few the daemon</text><text x="16" y="72">drew up. Minutes.</text>
  <text x="16" y="88" fill="#4a3d7a" font-weight="700" font-size="7.5">a new trick, today</text>
  <rect x="178" y="20" width="164" height="76" rx="8" fill="#e6f0ea" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="188" y="36" font-weight="700" font-size="10" fill="#2e5a3c">TRIED</text><text x="332" y="36" text-anchor="end" fill="#5a5a64" font-size="7.5">reinforcement</text>
  <text x="188" y="50">A goal it can measure. A search</text><text x="188" y="61">picks the next numbers to try from</text><text x="188" y="72">every score so far. Hours, over days.</text>
  <text x="188" y="88" fill="#2e5a3c" font-weight="700" font-size="7.5">a better walk, on your floor</text>
  <rect x="350" y="20" width="164" height="76" rx="8" fill="#e6eef6" stroke="#3d6a9a" stroke-width="1.4"/>
  <text x="360" y="36" font-weight="700" font-size="10" fill="#2c4f78">FOUND</text><text x="504" y="36" text-anchor="end" fill="#5a5a64" font-size="7.5">unsupervised</text>
  <text x="360" y="50">No goal. Every trial is filed by</text><text x="360" y="61">what it did, and the best in each</text><text x="360" y="72">place is kept. It costs nothing more.</text>
  <text x="360" y="88" fill="#2c4f78" font-weight="700" font-size="7.5">a turn it was never asked for</text>
  <path d="M88 96L88 116" stroke="#16161a" fill="none" marker-end="url(#ar)"/><path d="M260 96L260 116" stroke="#16161a" fill="none" marker-end="url(#ar)"/><path d="M432 96L432 116" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <!-- the harness -->
  <rect x="6" y="118" width="508" height="78" rx="8" fill="#16161a"/>
  <text x="18" y="134" fill="#fff" font-weight="700" font-size="10">THE TRIAL HARNESS</text><text x="504" y="134" text-anchor="end" fill="#d9d4c4" font-size="7.5">built first; the same for all three; a person present</text>
  <g font-size="7.5" text-anchor="middle">
    <rect x="14" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="47" y="156" fill="#fff" font-weight="700">1  CHECK</text><text x="47" y="167" fill="#d9d4c4">inside every limit,</text><text x="47" y="177" fill="#d9d4c4">near a safe one</text>
    <rect x="85" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="118" y="156" fill="#fff" font-weight="700">2  EASE IN</text><text x="118" y="167" fill="#d9d4c4">from rest,</text><text x="118" y="177" fill="#d9d4c4">over 2 seconds</text>
    <rect x="156" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="189" y="156" fill="#fff" font-weight="700">3  RUN</text><text x="189" y="167" fill="#d9d4c4">14 seconds</text><text x="189" y="177" fill="#d9d4c4">at most</text>
    <rect x="227" y="142" width="66" height="44" rx="4" fill="#b8524f"/><text x="260" y="156" fill="#fff" font-weight="700">4  ABORT</text><text x="260" y="167" fill="#fff">tilt, a touch, a</text><text x="260" y="177" fill="#fff">word, link lost</text>
    <rect x="298" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="331" y="156" fill="#fff" font-weight="700">5  EASE OUT</text><text x="331" y="167" fill="#d9d4c4">to rest, then</text><text x="331" y="177" fill="#d9d4c4">measure, still</text>
    <rect x="369" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="402" y="156" fill="#fff" font-weight="700">6  REST</text><text x="402" y="167" fill="#d9d4c4">twice as long</text><text x="402" y="177" fill="#d9d4c4">as it moved</text>
    <rect x="440" y="142" width="66" height="44" rx="4" fill="#2c2b33"/><text x="473" y="156" fill="#fff" font-weight="700">7  WRITE</text><text x="473" y="167" fill="#d9d4c4">sent, measured,</text><text x="473" y="177" fill="#d9d4c4">how it ended</text>
  </g>
  <path d="M260 196L260 214" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <!-- the record and what comes of it -->
  <rect x="178" y="216" width="164" height="42" rx="6" fill="#fff" stroke="#16161a"/>
  <text x="260" y="232" text-anchor="middle" font-weight="700" font-size="9">THE TRIALS</text>
  <text x="260" y="245" text-anchor="middle">every one kept, good or bad</text>
  <!-- feedback to tried and found -->
  <path d="M342 237L372 237" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <rect x="374" y="216" width="140" height="42" rx="6" fill="#fbf1dc" stroke="#c98a2b" stroke-width="1.4"/>
  <text x="444" y="232" text-anchor="middle" font-weight="700" font-size="9" fill="#8a5a12">A NEW ACTION</text>
  <text x="444" y="245" text-anchor="middle">named, with its one line; untrusted</text>
  <path d="M444 258L444 276" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <rect x="374" y="278" width="140" height="42" rx="6" fill="#e6f0ea" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="444" y="294" text-anchor="middle" font-weight="700" font-size="9" fill="#2e5a3c">THE REPERTOIRE</text>
  <text x="444" y="307" text-anchor="middle">trusted after ten clean runs</text>
  <!-- the night -->
  <path d="M178 237L148 237" stroke="#5a5a64" stroke-dasharray="3 2" fill="none" marker-end="url(#gr)"/>
  <rect x="6" y="216" width="140" height="104" rx="6" fill="#2c2944"/>
  <text x="76" y="232" text-anchor="middle" font-weight="700" font-size="9" fill="#fff">THE NIGHT</text>
  <text x="76" y="246" text-anchor="middle" fill="#d9d4c4">no servo moves</text>
  <text x="16" y="264" fill="#d9d4c4">the trials are read again;</text>
  <text x="16" y="275" fill="#d9d4c4">the search's picture redrawn;</text>
  <text x="16" y="286" fill="#d9d4c4">failing actions marked;</text>
  <text x="16" y="297" fill="#d9d4c4">a short list for tomorrow,</text>
  <text x="16" y="308" fill="#d9d4c4">which a person may ignore</text>
  <path d="M146 300L176 300L176 262" stroke="#5a5a64" stroke-dasharray="3 2" fill="none"/>
  <text x="260" y="284" text-anchor="middle" fill="#5a5a64" font-size="7.5">tomorrow's proposals start</text>
  <text x="260" y="294" text-anchor="middle" fill="#5a5a64" font-size="7.5">from everything already tried</text>
  <text x="6" y="340" font-size="8" fill="#5a5a64">A trial is never wasted: TRIED learns from its score, FOUND files it by what it did, and the night reads it again.</text>
</svg>

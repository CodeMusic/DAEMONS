<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="Gill Sans, Gill Sans MT, Avenir Next, Helvetica Neue, sans-serif">
  <!-- THE SPELL LEFT RUNNING: the Apprentice's own spell card, for the nap, filled in -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b1c20"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8862b"/></marker></defs>
<rect x="30" y="14" width="460" height="262" rx="10" fill="#fffdf6" stroke="#1b1c20" stroke-width="1.2"/>
<g transform="translate(456 52) scale(0.8)"><path d="M-22 0 Q0 -6 22 0 Q0 6 -22 0 Z" fill="#2b3a67"/><path d="M-12 -2 Q-2 -30 8 -42 Q4 -20 12 -2 Z" fill="#2b3a67"/><circle cx="-2" cy="-14" r="1.6" fill="#b8862b"/><circle cx="5" cy="-26" r="1.3" fill="#b8862b"/></g>
<text x="54" y="44" font-size="13" fill="#2b3a67" text-anchor="start" font-weight="600" letter-spacing="3">SPELL CARD</text>
<text x="300" y="44" font-size="10" fill="#5b5d66" text-anchor="start" font-weight="400" font-style="italic">no. 1, the Apprentice's own</text>
<text x="54" y="76" font-size="10.5" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="1.5">THE SPELL</text>
<text x="168" y="77" font-size="12.5" fill="#6b4f2a" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">Lie down in the sun. The brooms will see to it.</text>
<path d="M168 83 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="54" y="103" font-size="10.5" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="1.5">TRIGGER</text>
<text x="168" y="104" font-size="12.5" fill="#6b4f2a" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">a warm afternoon, and a heavy bucket</text>
<path d="M168 110 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="54" y="130" font-size="10.5" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="1.5">TASK</text>
<text x="168" y="131" font-size="12.5" fill="#6b4f2a" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">sleep, with the hat on</text>
<path d="M168 137 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="54" y="157" font-size="10.5" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="1.5">FOR</text>
<text x="168" y="158" font-size="12.5" fill="#6b4f2a" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">rest. I had carried three buckets.</text>
<path d="M168 164 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="54" y="184" font-size="10.5" fill="#b8862b" text-anchor="start" font-weight="600" letter-spacing="1.5">DONE WHEN</text>
<text x="168" y="185" font-size="12.5" fill="#9c3b2f" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">when someone has looked at the well</text>
<path d="M168 191 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="54" y="211" font-size="10.5" fill="#b8862b" text-anchor="start" font-weight="600" letter-spacing="1.5">WATCHED BY</text>
<text x="168" y="212" font-size="12.5" fill="#9c3b2f" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">me. Hat off first.</text>
<path d="M168 218 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="300" y="186" font-size="11" fill="#6b4f2a" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">nobody</text>
<path d="M298 182 H344" stroke="#9c3b2f" stroke-width="1.3"/>
<text x="54" y="238" font-size="10.5" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="1.5">TESTED</text>
<text x="168" y="238" font-size="10" fill="#5b5d66" text-anchor="start" font-weight="400" font-style="italic">calm ☑   tired □   hungry □   alone □   at scale □</text>
<path d="M168 245 H468" stroke="#8a8d96" stroke-width=".7"/>
<text x="300" y="262" font-size="10.5" fill="#9c3b2f" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive">the last two lines, written in later</text>
</svg>

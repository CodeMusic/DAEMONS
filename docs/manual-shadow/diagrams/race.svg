<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" font-family="Gill Sans, Gill Sans MT, Avenir Next, Helvetica Neue, sans-serif">
  <!-- THE SPELL LEFT RUNNING: a race: three brooms look at once and pour at once; a gate makes look-and-pour one step -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b1c20"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8862b"/></marker></defs>
<text x="20" y="26" font-size="12" fill="#1b1c20" text-anchor="start" font-weight="600" letter-spacing="2">WITHOUT A GATE</text>
<text x="20" y="54" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 1</text>
<path d="M110 50 H330" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="160" cy="50" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<rect x="214" y="43" width="70" height="14" rx="3" fill="#3a7ca5" stroke="#3a7ca5" stroke-width="1.2"/>
<text x="20" y="80" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 2</text>
<path d="M110 76 H330" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="160" cy="76" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<rect x="214" y="69" width="70" height="14" rx="3" fill="#3a7ca5" stroke="#3a7ca5" stroke-width="1.2"/>
<text x="20" y="106" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 3</text>
<path d="M110 102 H330" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="160" cy="102" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<rect x="214" y="95" width="70" height="14" rx="3" fill="#3a7ca5" stroke="#3a7ca5" stroke-width="1.2"/>
<text x="160" y="128" font-size="10" fill="#2b3a67" text-anchor="middle" font-weight="400" font-style="italic">look: “not full”</text>
<text x="249" y="128" font-size="10" fill="#3a7ca5" text-anchor="middle" font-weight="400" font-style="italic">pour</text>
<rect x="372" y="44" width="40" height="70" rx="3" fill="#fff" stroke="#1b1c20" stroke-width="1.2"/>
<rect x="373" y="40" width="38" height="73" fill="#3a7ca5" opacity=".55"/>
<path d="M366 58 H418" stroke="#b8862b" stroke-dasharray="4 3"/>
<text x="426" y="62" font-size="10" fill="#b8862b" text-anchor="start" font-weight="400" font-style="italic">full</text>
<text x="426" y="44" font-size="10" fill="#3a7ca5" text-anchor="start" font-weight="600">overflow</text>
<path d="M20 146 H500" stroke="#8a8d96" stroke-width=".8" stroke-dasharray="3 4"/>
<text x="20" y="172" font-size="12" fill="#b8862b" text-anchor="start" font-weight="600" letter-spacing="2">WITH A GATE</text>
<text x="20" y="200" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 1</text>
<path d="M110 196 H350" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="140" cy="196" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<rect x="150" y="189" width="70" height="14" rx="3" fill="#3a7ca5" stroke="#3a7ca5" stroke-width="1.2"/>
<text x="20" y="226" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 2</text>
<path d="M110 222 H350" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="232" cy="222" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<text x="246" y="226" font-size="10" fill="#b8862b" text-anchor="start" font-weight="600">full: stop</text>
<text x="20" y="252" font-size="10.5" fill="#5b5d66" text-anchor="start" font-weight="400">broom 3</text>
<path d="M110 248 H350" stroke="#8a8d96" stroke-width=".7"/>
<circle cx="300" cy="248" r="6" fill="#fff" stroke="#2b3a67" stroke-width="1.2"/>
<text x="314" y="252" font-size="10" fill="#b8862b" text-anchor="start" font-weight="600">full: stop</text>
<path d="M128 184 V270 M222 184 V270" stroke="#b8862b" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="175" y="282" font-size="10" fill="#b8862b" text-anchor="middle" font-weight="400" font-style="italic">one through the gate at a time</text>
<rect x="372" y="194" width="40" height="70" rx="3" fill="#fff" stroke="#1b1c20" stroke-width="1.2"/>
<rect x="373" y="208" width="38" height="55" fill="#3a7ca5" opacity=".55"/>
<path d="M366 208 H418" stroke="#b8862b" stroke-dasharray="4 3"/>
<text x="426" y="212" font-size="10" fill="#b8862b" text-anchor="start" font-weight="400" font-style="italic">full, and no more</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 256" font-family="Gill Sans, Gill Sans MT, Avenir Next, Helvetica Neue, sans-serif">
  <!-- THE SPELL LEFT RUNNING: an orphaned routine adopted by the first process -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b1c20"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8862b"/></marker></defs>
<rect x="170" y="24" width="180" height="40" rx="8" fill="#e9e6dc" stroke="#2b3a67" stroke-width="1.2"/>
<text x="260" y="42" font-size="11.5" fill="#2b3a67" text-anchor="middle" font-weight="600" letter-spacing="1.5">THE FIRST PROCESS</text>
<text x="260" y="56" font-size="10" fill="#5b5d66" text-anchor="middle" font-weight="400" font-style="italic">the one that started everything</text>
<rect x="40" y="112" width="170" height="40" rx="8" fill="#fff" stroke="#8a8d96" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="125" y="130" font-size="11.5" fill="#8a8d96" text-anchor="middle" font-weight="600">a younger self</text>
<text x="125" y="144" font-size="10" fill="#8a8d96" text-anchor="middle" font-weight="400" font-style="italic">(ended long ago)</text>
<path d="M220 64 L140 110" stroke="#8a8d96" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
<rect x="40" y="200" width="170" height="40" rx="8" fill="#e9e6dc" stroke="#1b1c20" stroke-width="1.2"/>
<text x="125" y="218" font-size="11.5" fill="#1b1c20" text-anchor="middle" font-weight="600">an old routine</text>
<text x="125" y="232" font-size="10" fill="#5b5d66" text-anchor="middle" font-weight="400" font-style="italic">still running</text>
<path d="M125 152 L125 198" stroke="#8a8d96" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
<path d="M212 218 Q330 210 292 66" stroke="#b8862b" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="372" y="166" font-size="11" fill="#b8862b" text-anchor="start" font-weight="400" font-style="italic">adopted: waited for,</text>
<text x="372" y="182" font-size="11" fill="#b8862b" text-anchor="start" font-weight="400" font-style="italic">and let finish</text>
</svg>

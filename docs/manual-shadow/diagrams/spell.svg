<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" font-family="Gill Sans, Gill Sans MT, Avenir Next, Helvetica Neue, sans-serif">
  <!-- THE SPELL LEFT RUNNING: the spell card: a routine's loop, its missing stop, and its watcher -->

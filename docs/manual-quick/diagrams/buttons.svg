<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62 0 530 200" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- QUICK START, step 1: a Game Boy Advance's buttons, drawn plain and labelled; no Nintendo artwork -->
  <!-- the shoulder buttons, L and R, behind the top edge -->
  <path d="M58 52 Q62 30 104 28 L140 28 L140 48 Z" fill="#4a4955"/>
  <path d="M362 52 Q358 30 316 28 L280 28 L280 48 Z" fill="#4a4955"/>
  <text x="112" y="38.5" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">L</text>
  <text x="308" y="38.5" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">R</text>
  <!-- the body -->
  <rect x="30" y="40" width="360" height="150" rx="62" fill="#e4e0ee" stroke="#16161a" stroke-width="2"/>
  <!-- the screen -->
  <rect x="128" y="56" width="164" height="114" rx="8" fill="#2b2b31"/>
  <rect x="140" y="66" width="140" height="94" rx="2" fill="#dfeedd"/>
  <text x="210" y="118" fill="#5a5a64" font-size="12" text-anchor="middle">the screen</text>
  <!-- the cross -->
  <rect x="58" y="92" width="48" height="16" rx="3" fill="#2b2b31"/>
  <rect x="74" y="76" width="16" height="48" rx="3" fill="#2b2b31"/>
  <!-- START and SELECT, below the cross -->
  <rect x="70" y="140" width="26" height="10" rx="5" fill="#7d7b86"/>
  <rect x="70" y="158" width="26" height="10" rx="5" fill="#7d7b86"/>
  <!-- A and B -->
  <circle cx="348" cy="94" r="15" fill="#2b2b31"/>
  <circle cx="318" cy="114" r="15" fill="#2b2b31"/>
  <text x="348" y="99" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">A</text>
  <text x="318" y="119" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">B</text>
  <!-- the labels, outside the body -->
  <g font-size="12.5" fill="#16161a" font-weight="600">
    <line x1="58" y1="100" x2="22" y2="100" stroke="#16161a" stroke-width="1"/>
    <text x="18" y="96" text-anchor="end">the cross</text>
    <text x="18" y="110" text-anchor="end" font-weight="400" fill="#5a5a64">walk</text>
    <line x1="70" y1="145" x2="22" y2="145" stroke="#16161a" stroke-width="1"/>
    <text x="18" y="149" text-anchor="end">START</text>
    <line x1="70" y1="163" x2="22" y2="178" stroke="#16161a" stroke-width="1"/>
    <text x="18" y="182" text-anchor="end">SELECT</text>
    <line x1="363" y1="94" x2="398" y2="94" stroke="#16161a" stroke-width="1"/>
    <text x="402" y="90">A</text>
    <text x="402" y="104" font-weight="400" fill="#5a5a64">yes</text>
    <line x1="318" y1="129" x2="398" y2="140" stroke="#16161a" stroke-width="1"/>
    <text x="402" y="138">B</text>
    <text x="402" y="152" font-weight="400" fill="#5a5a64">no</text>
    <text x="100" y="18" text-anchor="middle" font-weight="400" fill="#5a5a64">L, on the top edge</text>
    <text x="320" y="18" text-anchor="middle" font-weight="400" fill="#5a5a64">R, on the top edge</text>
  </g>
</svg>

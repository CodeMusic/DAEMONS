<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="10.5">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker></defs>
  <g fill="#fff" stroke="#16161a"><rect x="6" y="20" width="150" height="80" rx="8"/><rect x="185" y="20" width="150" height="80" rx="8"/><rect x="364" y="20" width="150" height="80" rx="8"/></g>
  <g font-weight="700" font-size="9" letter-spacing="1.5" fill="#6b3fa0"><text x="14" y="14">1  A CODE</text><text x="193" y="14">2  ASK</text><text x="372" y="14">3  ACCEPT</text></g>
  <g fill="#16161a">
    <text x="16" y="42">Your hub's THE COMMONS</text><text x="16" y="56">card shows your home's</text><text x="16" y="70">friend code. Give it to</text><text x="16" y="84">a friend, face to face.</text>
    <text x="195" y="42">On their hub, they enter</text><text x="195" y="56">your code and ASK.</text><text x="195" y="78">(Or you enter theirs.)</text>
    <text x="374" y="42">You ACCEPT on yours.</text><text x="374" y="56">Now your homes see each</text><text x="374" y="70">other's offers, and their</text><text x="374" y="84">daemons out together.</text>
  </g>
  <path d="M156 60L185 60" stroke="#16161a" marker-end="url(#ar)"/><path d="M335 60L364 60" stroke="#16161a" marker-end="url(#ar)"/>
</svg>

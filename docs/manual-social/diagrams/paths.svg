<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif" font-size="9.5">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16161a"/></marker></defs>
  <!-- your home -->
  <rect x="6" y="20" width="200" height="210" rx="10" fill="#f1ecf8" stroke="#8a5cc8" stroke-width="1.4"/>
  <text x="18" y="40" font-weight="700" font-size="10" letter-spacing="2" fill="#6b3fa0">YOUR HOME</text>
  <rect x="20" y="56" width="74" height="34" rx="6" fill="#fff" stroke="#16161a"/><text x="57" y="77" text-anchor="middle">your phone</text>
  <rect x="20" y="100" width="74" height="34" rx="6" fill="#fff" stroke="#16161a"/><text x="57" y="114" text-anchor="middle">a watch,</text><text x="57" y="126" text-anchor="middle">a board</text>
  <rect x="20" y="144" width="74" height="34" rx="6" fill="#fff" stroke="#16161a"/><text x="57" y="158" text-anchor="middle">another</text><text x="57" y="170" text-anchor="middle">player's phone</text>
  <rect x="116" y="88" width="80" height="62" rx="8" fill="#16161a"/><text x="156" y="111" text-anchor="middle" fill="#fff" font-weight="700">THE HUB</text>
  <text x="156" y="127" text-anchor="middle" fill="#d9d4c4" font-size="9">its exchange:</text><text x="156" y="139" text-anchor="middle" fill="#d9d4c4" font-size="9">players, trades</text>
  <path d="M94 73L116 102" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <path d="M94 117L116 119" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <path d="M94 161L116 136" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <text x="106" y="212" text-anchor="middle" font-size="8.5" fill="#5a5a64">the home network, or the tailnet</text>
  <!-- the commons -->
  <rect x="216" y="70" width="88" height="98" rx="10" fill="#fbfaf6" stroke="#16161a" stroke-dasharray="4 3"/>
  <text x="260" y="88" text-anchor="middle" font-weight="700">THE</text><text x="260" y="100" text-anchor="middle" font-weight="700">COMMONS</text>
  <text x="260" y="116" text-anchor="middle" font-size="8" fill="#5a5a64">homes, not people</text>
  <text x="260" y="128" text-anchor="middle" font-size="8" fill="#5a5a64">friends by code</text>
  <text x="260" y="140" text-anchor="middle" font-size="8" fill="#5a5a64">trades between</text>
  <text x="260" y="152" text-anchor="middle" font-size="8" fill="#5a5a64">friends' homes</text>
  <path d="M196 119L216 119" stroke="#16161a" fill="none" marker-end="url(#ar)"/><path d="M216 125L196 125" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <path d="M304 119L324 119" stroke="#16161a" fill="none" marker-end="url(#ar)"/><path d="M324 125L304 125" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <!-- a friend's home -->
  <rect x="314" y="20" width="200" height="210" rx="10" fill="#eef4ec" stroke="#5b8a4e" stroke-width="1.4"/>
  <text x="502" y="40" text-anchor="end" font-weight="700" font-size="10" letter-spacing="2" fill="#3f6b33">A FRIEND'S HOME</text>
  <rect x="324" y="88" width="80" height="62" rx="8" fill="#16161a"/><text x="364" y="111" text-anchor="middle" fill="#fff" font-weight="700">THEIR HUB</text>
  <text x="364" y="127" text-anchor="middle" fill="#d9d4c4" font-size="9">their players,</text><text x="364" y="139" text-anchor="middle" fill="#d9d4c4" font-size="9">their saves</text>
  <rect x="426" y="72" width="74" height="34" rx="6" fill="#fff" stroke="#16161a"/><text x="463" y="93" text-anchor="middle">their phone</text>
  <rect x="426" y="132" width="74" height="34" rx="6" fill="#fff" stroke="#16161a"/><text x="463" y="153" text-anchor="middle">their watch</text>
  <path d="M426 89L404 106" stroke="#16161a" fill="none" marker-end="url(#ar)"/><path d="M426 149L404 134" stroke="#16161a" fill="none" marker-end="url(#ar)"/>
  <text x="414" y="212" text-anchor="middle" font-size="8.5" fill="#5a5a64">devices only ever talk to their own hub</text>
</svg>
